<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password — SegForge</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
        :root {
            --bg-primary: #0e0e10; --bg-secondary: #18181b; --bg-elevated: #26262c;
            --text-primary: #efeff1; --text-secondary: #adadb8; --text-muted: #848494;
            --accent-primary: #9146ff; --accent-hover: #a970ff;
            --border-color: #2f2f35; --success: #00f593; --error: #eb0400;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 34px 30px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .brand { font-size: 20px; font-weight: 700; margin-bottom: 4px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
        p.sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.5; }
        label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        input[type="password"] {
            width: 100%; padding: 11px 13px; margin-bottom: 16px; font-size: 14px;
            background: var(--bg-elevated); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary); outline: none;
        }
        input[type="password"]:focus { border-color: var(--accent-primary); }
        button {
            width: 100%; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: #fff; border: none; border-radius: 8px; transition: opacity .15s;
        }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .msg { font-size: 13px; margin-top: 16px; line-height: 1.5; display: none; }
        .msg.error { color: var(--error); display: block; }
        .msg.success { color: var(--success); display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">SegForge</div>
        <h1>Set a new password</h1>
        <p class="sub" id="introText">Enter a new password for your account below.</p>

        <form id="resetForm">
            <label for="pw1">New password</label>
            <input type="password" id="pw1" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
            <label for="pw2">Confirm password</label>
            <input type="password" id="pw2" autocomplete="new-password" minlength="6" placeholder="Re-enter your new password" required>
            <button type="submit" id="submitBtn">Update Password</button>
        </form>

        <div class="msg" id="msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
